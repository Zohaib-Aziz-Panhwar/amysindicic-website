name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-site/package-lock.json
      - run: npm ci
        working-directory: react-site
      - run: npm run build
        working-directory: react-site
      - name: SPA fallback + no Jekyll
        run: cp react-site/dist/index.html react-site/dist/404.html && touch react-site/dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: react-site/dist
          publish_branch: gh-pages
          force_orphan: true
